name: Build init (arm64, Soong)

# Builds the real `init` Soong target (system/core/init/Android.bp) as an arm64 binary, using an
# AOSP source tree synced with `repo` and built with Soong/Kati, exactly like a real device's init
# would be built.
#
# `init` is a single `static_executable` (fully statically linked) that is installed to
# /system/bin/init and handles both pre-/system-mount and post-mount duties itself, based on how
# it is invoked. There is no separate init_first_stage/init_second_stage split.
#
# Since Soong analyzes the whole synced source tree, this cannot just sync `system/core` in
# isolation: it needs the rest of the platform build system, the toolchain prebuilts, and every
# AOSP project that init (transitively) depends on. To keep the sync small, `repo sync` is only
# pointed at that curated list of projects below instead of the full ~1000-project AOSP manifest.
# The checked-out contents of this repository are then swapped in for the synced `system/core`
# project, so the build actually compiles *this* repository's init sources.
#
# Runner setup (disk cleanup, swap space, repo/build environment) is modeled after
# https://github.com/carlodandan/OrangeFox-Action-Builder, adapted for a plain AOSP checkout
# instead of a recovery-project manifest.
# Note: no `paths` filter is used here. Since Soong analyzes the whole synced source tree and this
# repository's checked-out contents are swapped in wholesale for the synced `system/core` project
# (see above), a change to *any* file in this repository (not just `init/**`) can affect whether
# the build succeeds, so every push/pull_request should trigger this workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned AOSP release tag for reproducibility.
  AOSP_MANIFEST_URL: https://android.googlesource.com/platform/manifest
  AOSP_BRANCH: android-15.0.0_r36
  AOSP_ROOT: ${{ github.workspace }}/aosp
  # Newer AOSP branches require the 3-part `<product>-<release>-<variant>` lunch combo form;
  # `aosp_current` is the generic release config name documented for release branches where the
  # release-specific config name isn't otherwise needed.
  LUNCH_TARGET: aosp_arm64-aosp_current-userdebug
  # Only the projects `init` transitively needs: build system + toolchain prebuilts, bionic, the
  # platform libraries linked into init, and a generic arm64 product config to `lunch`. This is a
  # small subset of the full AOSP manifest (~1000+ projects).
  MINIMAL_PROJECTS: >-
    build/make
    build/soong
    build/blueprint
    build/release
    prebuilts/build-tools
    prebuilts/clang/host/linux-x86
    prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
    prebuilts/go/linux-x86
    prebuilts/misc
    prebuilts/runtime
    bionic
    system/core
    system/libbase
    system/logging
    system/sepolicy
    system/security
    system/extras
    system/unwinding
    system/apex
    system/gsid
    system/libprocinfo
    system/update_engine
    system/memory/lmkd
    system/tools/mkbootimg
    bootable/recovery
    external/selinux
    external/libcap
    external/libcap-ng
    external/avb
    external/boringssl
    external/protobuf
    external/lz4
    external/zlib
    external/zstd
    external/lzma
    external/fmtlib
    external/jsoncpp
    external/scudo
    external/googletest
    external/libxml2
    external/go-cmp
    external/golang-protobuf
    external/starlark-go
    device/generic/arm64
    device/generic/common
    device/generic/goldfish
    device/generic/goldfish-opengl
    prebuilts/vndk/v30
    prebuilts/vndk/v31
    prebuilts/vndk/v32
    prebuilts/vndk/v33
    prebuilts/vndk/v34
    toolchain/pgo-profiles
    external/spdx-tools
    system/tools/aidl
    system/tools/xsdc
    test/app_compat/csuite

jobs:
  build:
    name: Build init (arm64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: system_core_src

      - name: Free up runner disk space
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b
        continue-on-error: true

      - name: Add swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0
        with:
          swap-size-gb: 24

      - name: Install AOSP build environment packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 rsync bc file

      - name: Install repo tool
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Init minimal AOSP workspace
        run: |
          mkdir -p "${AOSP_ROOT}"
          cd "${AOSP_ROOT}"
          repo init -u "${AOSP_MANIFEST_URL}" -b "${AOSP_BRANCH}" \
            --depth=1 --partial-clone --clone-filter=blob:limit=10M -g all

      - name: Sync only the projects init needs
        run: |
          cd "${AOSP_ROOT}"
          repo sync -c -j"$(nproc)" --no-tags --optimized-fetch --prune --force-sync \
            ${MINIMAL_PROJECTS}

      - name: Overlay this repository as the system/core project
        run: |
          rm -rf "${AOSP_ROOT}/system/core"
          mkdir -p "${AOSP_ROOT}/system/core"
          rsync -a --exclude='.git' "${{ github.workspace }}/system_core_src/" "${AOSP_ROOT}/system/core/"

      - name: Work around Soong analysis errors unrelated to init
        # Soong analyzes the whole Blueprint module graph of every synced project up front
        # (regardless of which packages/products actually request a module), so any broken or
        # incompatible module definition in this workflow's minimal/partial AOSP checkout fails
        # the whole build, even though `init` never depends on these modules. Two such issues
        # are hit here:
        #
        # 1. system/security/keystore2/Android.bp's "libaconfig_android_hardware_biometrics_rust"
        #    rust_aconfig_library references the "android.hardware.biometrics.flags-aconfig"
        #    aconfig_declarations module, which is defined in hardware/interfaces -- a project
        #    this workflow intentionally doesn't sync (it's unrelated to init). Soong then panics
        #    with "Exactly one aconfig_declarations property required". Drop that module and its
        #    reference from keystore2's rustlibs.
        # 2. system/apex/apexd/apexd_testdata/Android.bp's "test_service-apexd" java_sdk_library
        #    is missing its "test" API scope signature file (apis_for_tests/test-current.txt),
        #    which doesn't exist even in a stock AOSP checkout at this pinned tag. Add a vendored
        #    stub matching the module's actual (trivial) API surface.
        run: |
          python3 "${{ github.workspace }}/system_core_src/.github/ci-overrides/remove_biometrics_rust_aconfig_module.py" \
            "${AOSP_ROOT}/system/security/keystore2/Android.bp"

          cp "${{ github.workspace }}/system_core_src/.github/ci-overrides/apexd_testdata-test-current.txt" \
            "${AOSP_ROOT}/system/apex/apexd/apexd_testdata/apis_for_tests/test-current.txt"

      - name: Build init with Soong
        run: |
          cd "${AOSP_ROOT}"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "${LUNCH_TARGET}"
          m init -j"$(nproc)"

      - name: Locate and verify the built arm64 binary
        run: |
          cd "${AOSP_ROOT}"
          INIT_BIN="$(find out/target/product -path '*/system/bin/init' -type f 2>/dev/null | head -n1)"
          if [ -z "${INIT_BIN}" ]; then
            INIT_BIN="$(find out/soong/.intermediates/system/core/init/init \
              -type f -name init | head -n1)"
          fi

          if [ -z "${INIT_BIN}" ]; then
            echo "Could not locate the built init binary under out/" >&2
            exit 1
          fi

          echo "INIT_BIN=${INIT_BIN}" >> "${GITHUB_ENV}"

          echo "== init (must be a single static /system/bin/init binary) =="
          file "${INIT_BIN}"
          file "${INIT_BIN}" | grep -q "ARM aarch64"
          file "${INIT_BIN}" | grep -qi "statically linked"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: init-arm64
          path: |
            ${{ env.INIT_BIN }}
